[workspace]
resolver = "3"
members  = ["abi", "kernel"]
# `user/` is its own workspace: the kernel's build script builds it into a
# separate target directory and embeds the result, so it must not be a member
# here or a plain `cargo build` would recurse (D-039).
exclude  = ["user"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

# The target already forces panic=abort; restating it warns for the test profile.
[profile.dev]
opt-level = 0
debug     = true

[profile.release]
# Debug info in release too, for reading disassembly when M5 gets measured.
debug         = true
lto           = true
codegen-units = 1
