[workspace]
resolver = "3"
members  = ["kernel"]
# Future siblings (do not add until their milestone):
#   user/pager      (M6)
#   user/virtio-blk (M7)
#   user/fs         (M7)

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

# The target already forces panic=abort; restating it warns for the test profile.
[profile.dev]
opt-level = 0
debug     = true

[profile.release]
# Debug info in release too, for reading disassembly when M5 gets measured.
debug         = true
lto           = true
codegen-units = 1
